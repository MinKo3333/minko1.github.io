<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formater stringen</title>
</head>
<body>
  <script>
   let message = prompt('Write an word')
   let firstletter = message.charAt(0)
   let upperFirstletter = firstletter.toUpperCase()
   let rest = message.slice(1)
  

   document.write(upperFirstletter + rest)
   
  </script>
</body>
</html>
