<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Light Bulb</title>
  <style>
  #bulbbox{
    background-color: gray;
    width: 225px;
    height: 225px;    
  }
  </style>
</head>
<body>

  <div id="bulbbox"></div>
  <button id="button1">lys på</button>

<script>
  let bulbimg = bulbbox.querySelector('img')
  let imageInBox = true
  let button1 = document.getElementById('button1')

  button1.addEventListener('click',() =>{ 
    if(imageInBox == false){  
    bulbbox.style.backgroundColor = 'gray';
    document.body.style.backgroundColor = 'white' ;
    bulbbox.innerHTML = '<p>light off</p>';
    imageInBox = true;
  }
   

   else { 
    bulbbox.innerHTML = '<p>light on</p><img src="bulb.png"> ';
    document.body.style.backgroundColor = 'rgba(255, 255, 174, 0.973)'
    bulbbox.style.backgroundColor = 'rgba(255, 255, 174, 0.973)'
    imageInBox = false;}
   // bulbbox.style.backgroundColor = '';

  

  } )
</script>
</body>
</html>
