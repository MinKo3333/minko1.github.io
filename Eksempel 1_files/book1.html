<html lang="en">

<body>
  <h1>4의 배수일까 아닐까</h1>
  <p id="result"></p>
<script>
 var result = document.getElementById('result')
 var number = prompt('숫자를 입력하시오.')
 
if(number === null){
  result.innerHTML = '숫자를 입력하지 않았습니다.'
  }
else{
  if(number%4 === 0){
    result.innerHTML = number + '는 4의 배수입니다.'

    }
  else 
   {result.innerHTML = number + '는 4의 배수가 아닙니다.'}
}
</script>
</body>
</html>
