<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
  run()
    function run(){
      let newImg = document.createElement('img');
      let srcNode = document.createAttribute('src');
      let altNode = document.createAttribute('alt');
      srcNode.value = 'pic1.jpg';
      altNode.value = '돔 트리 예제 이미지';//밸류 부여
      newImg.setAttributeNode(srcNode);
      newImg.setAttributeNode(altNode);// 어트리븃노드를 요소에 연결
      document.body.appendChild(newImg)//연결한 img태그를 body에 연결
      document.getElementsByTagName('img')[0].style.width = '500px'
      document.getElementsByTagName('img')[0].style.height = '500px'
   
    let newP = document.createElement('p')
    let txtNode = document.createTextNode('DOM은 document object model의 줄임말 입니다.')
    newP.appendChild(txtNode);
    document.body.appendChild(newP)
    
  }
  
  </script>
</body>
</html>
