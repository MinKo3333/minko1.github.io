<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div style="text-align: center;">
  <h1>3의 배수 찾기</h1>
  <p id="result"></p>
  <p id="howMany" style="color: red; font-weight: bold; "></p>
  </div>
<script>

  var number =prompt('숫자 몇까지 3의 배수를 찾을까요?')
  var result = document.getElementById('result')
  var howMany = document.getElementById('howMany')
  var i = 1
  var times = number/3

if(number == null){
  result.innerHTML = '숫자를 입력하지 않았습니다.'
}
else {
  while(i <= times){
    if( i===1 ){
      
      result.innerHTML += '' + i *3;
    }
    else {
      result.innerHTML += ', ' + i*3
   }i++
    }
  
  


  document.write( '<br>')
  howMany.innerHTML = number + '까지 3의 배수의 개수' + ' : ' + (i-1)
  
}


</script>

</body>
</html>
