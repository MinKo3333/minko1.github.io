<head>

<body>
  <input type="number" name="x" placeholder="숫자를 입력하세요." id="x">
  
  <input type="number" name="y" placeholder="숫자를 입력하세요." id="y">
  <button id="submit">submit</button>
  <script>
   
    document.getElementById('submit').onclick = sumMulti
      
    function sumMulti(){
    let a = parseInt(document.getElementById('x').value)
    let b = parseInt(document.getElementById('y').value)
      if(isNaN(a)||isNaN(b)){
        console.log('숫자를 입력하세요.')
        return
      }
      else{



    
    let sum = a + b
    let times = a * b
      
      if(a === b){
        console.log(times)
      }
      else{
        console.log(sum)
      }
    }
    } 

  </script>
