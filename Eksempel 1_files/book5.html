<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
</head>
<body>
  <input type="date" id="start">
  <div style="border-radius: 50%; border: black 1px solid; text-align: center; width: 300px; height: 300px; background-color: rgb(172, 232, 255);">
    <br><br>
    <h2>책 읽기</h2>
    <p id="nalzza">날짜를 선택해주세요.</p>
  </div>

  <script>
  
    var date = document.querySelector("#start");
    function updateNalzza() {   

    var now = new Date(); // 현재 날짜
    var firstDay = new Date(date.value); // 사용자가 선택한 날짜

    var toNow = now.getTime();
    var toFirst = firstDay.getTime();
    var answer = Math.round((toNow - toFirst) / (1000 * 60 * 60 * 24));

  
     

      document.querySelector("#nalzza").innerHTML = `
        <p>${answer}일 연속으로<br>책 읽기를 달성했군요.<br><br>축하합니다!</p>`;
    }

    date.addEventListener("change", updateNalzza);
  </script>
</body>
</html>
