<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할 일 목록</title>
  <style>
    .check {
      margin-right: 8px;
      color: gray;
      cursor: pointer; /* 클릭 가능한 느낌 */
    }
  </style>
</head>
<body>
  <h1 style="font-weight: bold;">할 일 목록</h1>
  <ul id="list" style="list-style: none;">
    <li><span class="check">✔</span>할 일 1</li>
    <li><span class="check">✔</span>할 일 2</li>
    <li><span class="check">✔</span>할 일 3</li>
    <li><span class="check">✔</span>할 일 4</li>
    <li><span class="check">✔</span>할 일 5</li>
  </ul>
  <script>
    var checks = document.querySelectorAll('.check');  // 체크 아이콘들 선택

    for (let i = 0; i < checks.length; i++) {
      checks[i].addEventListener('click', function() {
        const parent = this.parentNode; // 클릭한 요소의 부모(li) 가져오기
        
        // 부모(li) 스타일 변경: 가로줄과 색상 변경
        parent.style.textDecoration = 'line-through';
        parent.style.color = 'lightgray';
      });
    }
  </script>
</body>
</html>
