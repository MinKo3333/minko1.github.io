<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>book9</title>
</head>
<body>

  <div class="row">
    <ul style="list-style: none; display: flex; flex-direction: row; gap: 5px">
      <li><img src="pic1.jpg" data-src="pic1.jpg" class="pic" style="width: 50px;height: 50px;"></li>
      <li><img src="pic2.jpg" data-src="pic2.jpg" class="pic" style="width: 50px;height: 50px;"></li>
      <li><img src="pic3.jpg" data-src="pic3.jpg" class="pic" style="width: 50px;height: 50px;"></li>
    </ul>
  </div>

  <div id="lightbox" >
    <img src="pic1.jpg" alt="" id="lightboxImage"style="width: 500px; height: auto;">
  </div>

  <script>
    var pics = document.getElementsByClassName('pic');//[pic1(0),pic2(1),pic3(2)]
    var lightbox = document.getElementById('lightbox');//div
    var lightboxImage = document.getElementById('lightboxImage');//img

for(i=0; i< pics.length; i++){
  pics[i].addEventListener('click', showLightbox)
}
//모든 요소에 이벤트리스너 적용

function showLightbox(){
  var bigLocation = this.getAttribute('data-src');
  lightboxImage.setAttribute('src', bigLocation);
  lightbox.style.display = 'block';
}//소스를 data-src로 변경

lightbox.onclick = function(){
  lightbox.style.display = 'none';
}

  </script>
</body>
</html>
