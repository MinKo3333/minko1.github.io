<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
 
      td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}
   </style>
</head>
<body>
  <input type="number" id="row"><span>row</span><input type="number" id="colonm"><span>colonm</span>
  <button id="run" onclick="makeTable()">make</button>

  <script>
    

    function makeTable(){

      let run = document.getElementById('run')
      
      let row = document.getElementById('row')
      let colonm = document.getElementById('colonm')

      

       let how = row.value
       let many = colonm.value

       let table = document.createElement('table')

       for(let i =0; i < how; i++){
       let tr = document.createElement('tr')
        
      
       for(let j =0; j < many; j++){
        
        let td = document.createElement('td')
        tr.appendChild(td)
        let text = document.createTextNode(`행${i+1}, 열${j+1}`)
        td.appendChild(text);
        tr.appendChild(td);
       }
       table.appendChild(tr)
      

      document.body.appendChild(table)
    }}

  </script>
</body>
</html>
