<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kalkulator</title>
</head>

<body>
  <input id="number1" type="number"> +
  <input id="number2" type="number">
  <button id="controller">=</button>
  <div id="app"></div>



  <script>
    function plus(number1, number2) {
      const result = parseInt(number1) + parseInt(number2);
      return result;
    }

    function updateView(number1, number2, result) {
      document.getElementById('app').innerHTML += /*HTML*/
        `<div>${number1} + ${number2} = ${result}</div>`
    }

    let controller = document.getElementById('controller')

    controller.addEventListener('click', function () {
      console.log('= click')

      const number1 = document.getElementById('number1').value
      const number2 = document.getElementById('number2').value

      const result = plus(number1, number2)
      updateView(number1, number2, result)
    })


    /*
      Lage en kalkulator
      * To inputfelter
      * = knapp
      * output
      * 
      * Når du klikkser på = knappen skal tallene i de to inputfeltene plusses sammen
      * og svaret skal vises i outputfeltet
     */

  </script>

</body>

</html>
