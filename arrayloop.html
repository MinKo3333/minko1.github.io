<body>
  <input id="app">
  <button onclick="update()">add to cart</button>
  <div id = "result"></div>
 <script>
   let handlevogn = []
   let result = document.getElementById('result')

  function update(){
    let input = document.getElementById('app').value
   
    handlevogn.push(input)
    result.innerHTML += `
      <li>${handlevogn[handlevogn.length-1]}</li>`
   
    }
