<body>
  <button onclick="bigger()">△</button>
  <p id="number">0</p>
  <button onclick="smaller()">▽</button>
  <script>
   
 
   
   let result = document.getElementById('number').innerText

    function bigger() {

     
     result = parseInt(result) + 1
     document.getElementById('number').innerText = result
     
     
    }

    function smaller() {

     
      result = parseInt(result) - 1
     document.getElementById('number').innerText = result
     
    }
