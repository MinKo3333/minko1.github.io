  <button id="startgame" onclick="updateView()">light on</button>

 <script>

   for(let index=0; index<=24; index++){

    document.getElementsByClassName('sirkulær')[index].id =  index

  }  // set id
  

let lampbefore
let lampnow

let startTimer
let clicked = false

function updateView(){


  if(startTimer){

clearInterval(startTimer)
startTimer = null
}
  
let startsecond = 0

  function timerupdate(){
    
    let timer = document.getElementById('timer') 
    startsecond += 0.01
    timer.innerHTML = startsecond.toFixed(2)
   
  }

  startTimer = setInterval(timerupdate,10)  //timer

  let  startTime = new Date().getTime()
 

  if(lampbefore){lampbefore.classList='sirkulær'}

  indexNumber = Math.floor(Math.random()*25)

  lampnow = document.getElementById(indexNumber)
  lampnow.classList.remove('sirkulær')
  lampnow.classList.add('lighton') //turn on lamp
  lampbefore = document.getElementById(indexNumber)
 
  
  function showResult(){
    console.log(clicked)
  if(clicked) {
  
  console.log(lampnow)
  lampnow.removeEventListener('click', showResult)


}
  else{
  
   lampbefore = document.getElementById(indexNumber)
  let finishTime = new Date().getTime()
  let seconds = (finishTime-startTime)/1000 //calculate time
  let result = document.getElementById('result')

  result.innerHTML += `${seconds} <br>`  //show time

  startTime = null
  
  clicked = true 
  
  if(startTimer){

    clearInterval(startTimer)
    setTimeout(updateView,1000)
 
  }}

  }
 
  




  clicked = false

  lampnow.addEventListener('click',showResult)
}


function stop(){
  if(startTimer){
    clearInterval(startTimer)
    startTimer = null
    lampnow.removeEventListener('click', showResult)
  }
}


  </script>
