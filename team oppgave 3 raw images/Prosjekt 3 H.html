<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Car Game</title>
    <link rel="stylesheet" href="styles.css"/>
    <style>
        /* CSS for spillgrensesnittet */
        /* Kommentar: Legg til enkel styling her */
    </style>
</head>
<body>

  <!-- Kommentar: HTML-innhold som viser status og spillknapp -->
  <h1>Car Game</h1>

  <div id="app">      
      <!--<div id="progressBar">
      Kulhet <br>
      <progress id="file" value="10" max="20">  </progress>
    </div>

    <div id="game-output">
       Kommentar: Her vil spillstatusen vises 
    </div>
      
    <div id="textBox">
      Test-text
    </div>-->
      
    <div id="buttons">
      <button id="start-button" onclick="startGame()">Start spillet</button>
    </div>
  </div>

  <script>
    //Modell
    var coolMeter = 10; 
    var event = []
    var lockedItemEvents = []
    var friends = ['p1', 'p2']
    var possibleEvents = ['spoiler', 'poop', 'panserornament']
    var eventsLeft = 5;
    let endcarhappened = false
    let poophappened = false
    let cathappened = false
    let carhappened = false
    let chance = Math.round(Math.random()*10)

    // Kommentar: JavaScript-kode begynner her

        // Kommentar: Modellene (klasser for Car, Event, Friend)
        // Funksjon: Definer Car-klassen (kulhet på bilen)
        // Funksjon: Definer Event-klassen (hendelser som skjer på veien)
        // Funksjon: Definer Friend-klassen (kompiser og hilsener)

    // Kommentar: Visning - funksjoner som viser bilens status og hendelser
    // Funksjon: displayCarStatus - Vis bilens kulhet
    // Funksjon: displayEvent - Vis informasjon om hendelser
    // Funksjon: displayGreetings - Vis hilsener som kan velges
    //document.getElementById('start-button').addEventListener('click', startGame);
    

    function startGame() {
      console.log('reached start function')
      document.getElementById('app').innerHTML = `
      <div id="progressBar">
        Kulhet <br>
        <progress id="file" value="10" max="20">  </progress>
      </div>

      <div id="textBox">
      </div>

      <div id="buttons"></div>
        `;
      nextEvent()
    }

    function meetingFriend() { // Kan dele i to. En for første møte og en for andre
      console.log("reached meeting friend")
      correctGreeting = [true, false, false]
      order = []
      for (i=0; i<3; i++) {
        index = Math.floor(Math.random() * correctGreeting.length)
        order.push(correctGreeting[index])
        correctGreeting.splice(index, 1)
      }
      if (friends.length == 2) {
        if (Math.random()<0.5) {
          textBox.innerHTML = "Du ser VENN 1 gå langs veien og stopper opp. Hvordan vil du hilse?"
          buttons.innerHTML = /*html*/ `       
          <button onclick="greet(${order[0]})">"Ute og får deg litt frisk luft?"</button>
          <button onclick="greet(${order[1]})">"Hvor skal du?"</button>
          <button onclick="greet(${order[2]})">Tut med bilhornet</button>
          `
          friends.splice(0,1)
        } else {
          textBox.innerHTML = "Du ser VENN2 gå langs veien. Hvordan vil du hilse?"
          buttons.innerHTML = /*html*/ `
          <button onclick="greet(${order[0]})">"Ute og trener igjen?"</button>
          <button onclick="greet(${order[1]})">"Neimen, var det den karen som var ute å gikk?"</button>
          <button onclick="greet(${order[2]})">Tut med bilhornet</button>
          `
          friends.splice(1,1)
        }
      } else if (friends[0] = 'p1') {
        textBox.innerHTML = "Du ser VENN 1 gå langs veien og stopper opp. Hvordan vil du hilse?"
        buttons.innerHTML = /*html*/ `       
          <button onclick="greet(${order[0]})">"Ute og får deg litt frisk luft?"</button>
          <button onclick="greet(${order[1]})">"Hvor har du tenkt det? Vil du sitte på?"</button>
          <button onclick="greet(${order[2]})">Tut med bilhornet</button>
        `
      } else if (friends[0] = 'p2') {
        textBox.innerHTML = "Du ser VENN2 gå langs veien. Hvordan vil du hilse?"
          buttons.innerHTML = /*html*/ `
          <button onclick="greet(${order[0]})">"Ute og trener igjen?"</button>
          <button onclick="greet(${order[1]})">"Neimen, var det den karen som var ute å gikk?"</button>
          <button onclick="greet(${order[2]})">Tut med bilhornet</button>
        `
      }
    }

    function greet(input) {
      if (input && coolMeter > 10) {
        textBox.innerHTML = "Riktig valg og også kul"
        buttons.innerHTML = "<button onclick='nextEvent()'>Neste scene</button>"
      } else if (input && coolMeter <= 10) {
        textBox.innerHTML = "Riktig valg, men ikke kul"
        buttons.innerHTML = "<button onclick='nextEvent()'>Neste scene</button>"
      } else {
        textBox.innerHTML = "Feil valg"
        buttons.innerHTML = "<button onclick='nextEvent()'>Neste scene</button>"
      }
    }
    
    function nextEvent() {
      console.log('next event')
      textBox.innerHTML = ''

      if (eventsLeft > 3) { //eksempel-tall
        coolnessEvent()
        //changeCM()
        eventsLeft--
        //buttons.innerHTML = "<button onclick='nextEvent()'>Neste scene</button>"
      } else if (eventsLeft == 3) {
        meetingFriend()
        eventsLeft--
      } else if (eventsLeft == 2) {
        coolnessEvent()
        //changeCM()
        eventsLeft--
      } else if (friends.length == 1) { //kan bruke eventsLeft på alle
        meetingFriend()
        friends = []
      } else if (friends.length == 0) {
        destination()
      }
    }

    function coolnessEvent() {
      if (possibleEvents[0] == 'spoiler') {
        textBox.innerHTML = 'Du finner en spoiler på bakken. Vil du feste den på bilen?'
        buttons.innerHTML = `<button onclick='pickUp()'>Ja, den så kul ut.</button> 
        <button onclick='noPickUp()'>Nei, jeg vil kjøre videre</button> `
        console.log('Kommer hit?')
      } else if (possibleEvents[0] == 'poop') {
        textBox.innerHTML = 'Du kjører over en hestebæsj. Ikke kult!'
        buttons.innerHTML = "<button onclick='nextEvent()'>Neste scene.</button>"
        changeCM(-3)
      } else if (possibleEvents[0] == 'panserornament') {
        textBox.innerHTML = 'Du finner et panserornament på bakken. Vil du feste den på bilen?'
        buttons.innerHTML = `<button onclick='pickUp()'>Ja, den så kul ut.</button> 
        <button onclick='noPickUp()'>Nei, jeg vil kjøre videre</button> `
      }
      possibleEvents.splice(0,1)
    }

    function pickUp() {
      textBox.innerHTML = 'Du plukker opp dingsen fra bakken og fester den på bilen.'
      buttons.innerHTML = "<button onclick='nextEvent()'>Neste scene.</button>"
      changeCM(4)
    }

    function noPickUp() {
      textBox.innerHTML = "Du kjører videre uten å plukke opp noe. Ingen forandring i kulhet."
      buttons.innerHTML = "<button onclick='nextEvent()'>Neste scene.</button>"
    }

    function changeCM(input) { //To do: Tekst og ikke random
      cmChange = (Math.floor(Math.random() * 8)-3)
      if (input) {cmChange = input}
      coolMeter += cmChange
      updateCoolness()
      if(cmChange<0) {
        textBox.innerHTML += '<br>' + cmChange + ' kulhet <br> Ny total: ' + coolMeter
        return
      }
      textBox.innerHTML += '<br>+' + cmChange + ' kulhet <br> Ny total: ' + coolMeter
    }
    
    function destination() {
      friends = ['p1', 'p2']
      eventsLeft = 5
      coolMeter = 10
      possibleEvents = ['spoiler', 'poop', 'panserornament']
      textBox.innerHTML = "Du er fremme. Reisen er over"
      buttons.innerHTML = "<button onclick='startGame()'>Starte på nytt?</button>"
    }

    function updateCoolness () {
      document.getElementById("progressBar").innerHTML = /*html*/ `
      Kulhet <br>
      <progress id="file" value="${coolMeter}" max="20">  </progress> `
    }
        
        // Kommentar: Spillkontroller - funksjoner for å håndtere spillvalg
        // Funksjon: handleEvent - Håndter hendelse (kompis, aggressiv bestemor, kule ting)
        // Funksjon: handleGreeting - Håndter hilsen (korrekt/feil valg)
        
        // Kommentar: Spillflyt (loop eller spilllogikk)
        // Funksjon: startGame - Start spillflyten, opprett objekter, vis status, håndter hendelser
        
        // Kommentar: Interaktivitet - spillknapp som starter spillet
        // Funksjon: EventListener på start-knappen som starter spillet
        
  </script>

</body>
</html>
