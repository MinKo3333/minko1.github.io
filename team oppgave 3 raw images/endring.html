<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Car Game</title>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
    <h1>Cool Car Game</h1>
    
    <div id="progressBar">
        Kulhet <br>
        <progress id="file" value="2" max="10"></progress>
    </div>
    
    <div id="game-output"></div>
    
    <button id="start-button">Start spillet</button>
    
    <div id="alertbox"></div>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const startButton = document.getElementById("start-button");
            startButton.addEventListener("click", function() {
                game.resetGame();
                game.startGame();
            });
        });
        
        class Game {
            constructor() {
              this.coolMeter = this.coolMeter || 2;
                this.gameOver = false;
            }

            resetGame() {
              this.coolMeter = this.coolMeter || 2;
                this.gameOver = false;
                document.getElementById("file").value = this.coolMeter;
                document.getElementById("game-output").innerHTML = "";
                document.getElementById("alertbox").innerHTML = "";
                document.getElementById("start-button").innerHTML = "Start spillet";
                document.getElementById("start-button").disabled = false;
                console.log("Spillet er tilbakestilt");
            }

            startGame() {
                if (this.gameOver) return;

                document.getElementById("start-button").innerHTML = 'Neste';
                document.getElementById("game-output").innerHTML = `
                    <p>Game has started</p>
                    <div id="status"></div>
                    <div id="events"></div>
                    <div id="greetings"></div>
                    <div id="alertbox"></div>
                `;
                this.triggerEvent();
            }

            triggerEvent() {
              console.log(game.coolMeter)
                if (this.gameOver) return;

                let chance = Math.random() * 100;
                let message = "";

                if (chance < 20) {
                    message = "💩 Du kjørte på hestebæsj! Reager!";
                    this.updateCoolness(-2);
                } else if (chance < 40) {
                    message = "🐱 En katt sier: 'Du er kjempekul!";
                    this.updateCoolness(2);
                } else if (chance < 50) {
                    if (this.coolMeter >= 6) {
                        message = "👵 Hvordan går det med deg?";
                        this.updateCoolness(2);
                    } else {
                        message = "👵 I don't speak with ugly people.";
                        this.updateCoolness(-1);
                    }
                } else if (chance < 70) {
                    if (this.coolMeter >= 7) {
                        message = "🤵 Du ser ut som en suksessfull person! Her er 3 kulepoeng!";
                        this.updateCoolness(2);
                    } else {
                        message = "🤵 Ugh, jeg hater middelmådige folk.";
                        this.updateCoolness(-1);
                    }
                } else {
                    message = "En snill gutt er på veien. Han vasker bilen din gratis!";
                    this.updateCoolness(2);
                }

                document.getElementById("alertbox").innerHTML = `<p>${message}</p>`;
            }

            updateCoolness(amount) {
                if (this.gameOver) return;
                this.coolMeter = Math.min(10, Math.max(0, this.coolMeter + amount));
                document.getElementById("file").value = this.coolMeter;
                document.getElementById("game-output").innerHTML = `<p>Coolness: ${this.coolMeter}</p>`;
                if (this.coolMeter >= 10) this.endGame();
            }

            endGame() {
                this.gameOver = true;
                document.getElementById("game-output").innerHTML = "🎉 Du har vunnet spillet!";
                document.getElementById("start-button").disabled = true;
            }
        }
        
        const game = new Game();
    </script>
</body>
</html>
