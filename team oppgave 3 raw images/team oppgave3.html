<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Car Game</title>
    <link rel="stylesheet" href="styles.css"/>
    <style>
        /* CSS for spillgrensesnittet */
        /* Kommentar: Legg til enkel styling her */
    </style>
</head>
<body>

    <!-- Kommentar: HTML-innhold som viser status og spillknapp -->
    <h1>Cool Car Game</h1>

    <div id="progressBar">
      Kulhet <br>
      <progress id="file" value="0" max="10">  </progress>
    </div>

    <div id="game-output">
        <!-- Kommentar: Her vil spillstatusen vises -->
    </div>

    <button id="start-button">Start spillet</button>

    <div id="textBox">
      Test-text
    </div>

    <script>
      
  class SpillFlyt {
    constructor() {
        this.coolMeter = 3;
    }

    startGame() {
        console.log("🚗 Spill starter!");
        document.getElementById("game-output").innerHTML = "🚗 Spillet har startet!";
        this.updateCoolness(0);
        this.triggerEvent();  // 첫 번째 이벤트 실행
    }

    triggerEvent() {
        let chance = Math.round(Math.random() * 10);
        let message = "";
        
        if (chance >= 8) {
            message = "💩 Du kjørte på hestebæsj! Reager!";
            this.updateCoolness(-3);
        } else if (chance < 4) {
            message = "🐱 En katt sier: 'Du er kjempekul!'";
            this.updateCoolness(3);
        } else {
            message = "👵 En gammel dame venter på en hilsen.";
        }

        document.getElementById("alertbox").innerHTML = `<p>${message}</p>`;
    }

    updateCoolness(amount) {
        this.coolMeter += amount;
        document.getElementById("coolness-bar").value = this.coolMeter;

        if (this.coolMeter >= 10) {
            document.getElementById("game-output").innerHTML = "🎉 Du er den kuleste sjåføren!";
        }
    }
}

          document.getElementById('start-button').addEventListener('click', startGame);
          
          let CoolMeter = 10;
          
          function startGame() {
              document.getElementById('game-output').innerHTML = `
                  <p>Game has started</p>
                  <div id="status"></div>
                  <div id="events"></div>
                  <div id="greetings"></div>
                  <div id="alertbox"></div>
              `;

              displayCarStatus();
              EventClass();

          }
  
        
        function displayCarStatus() {
          const statusElement = document.getElementById('game-output');
          if (statusElement) {
            statusElement.innerHTML += `<p>Coolness: ${CoolMeter}</p>`;
            }
          }


        function displayEvent(message, isPositive) {
          const eventsElement = document.getElementById('events');
          if (eventsElement) {
              eventsElement.innerHTML += 
              `<p class="${isPositive ? 'positive' : 'negative'}">${message}</p>`;
            }
          }

          function displayGreetings(greeting) {
            const greetingsElement = document.getElementById('greetings');
            if (greetingsElement) {
              greetingsElement.innerHTML += `<p class="greeting">${greeting}</p>`;
            }
          }
          function reactToManure(choice) {
            let alertbox = document.getElementById('alertbox');
            switch (choice) {
              case 'avoid': CoolMeter += 3;
                alertbox.innerHTML =  `<p class="positive">Du unngikk bæsjen</p>`;
                break;
                case 'drive': CoolMeter -= 2;
                alertbox.innerHTML = `<p class="negative">Æsj!</p>`;
                break;
                case 'stop': CoolMeter += 0;
                alertbox.innerHTML = `<p class="neutral">Hva nå?</p>`;
                break;
            }
         
            displayCarStatus(CoolMeter);
          }

          
          
          // Kommentar: Spillkontroller - funksjoner for å håndtere spillvalg
          // Funksjon: handleEvent - Håndter hendelse (kompis, aggressiv bestemor, kule ting)
          // Funksjon: handleGreeting - Håndter hilsen (korrekt/feil valg)
          
        
        // Kommentar: Spillflyt (loop eller spilllogikk)
        // Funksjon: startGame - Start spillflyten, opprett objekter, vis status, håndter hendelser
        
        // Kommentar: Interaktivitet - spillknapp som starter spillet
        // Funksjon: EventListener på start-knappen som starter spillet
        
        </script>

</body>
</html>
