<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To do list</title>
</head>

<body>
  <div>
    <input type="text" name="todo">
    <button onclick="submit()">submit</button>
  </div>

  <div id="tablearea"></div>


  <script>

    let todoinput = document.getElementsByName('todo')[0]
    let firstclick = false
    let todofix = false
    let undone


    document.addEventListener("click", function (event) {



      if (event.target.name === 'done') {
        toggleChecked(event.target)
      }
      if (event.target.name === 'todoArea' && todofix == false) {
        todoArea = event.target
        console.log(todoArea)
        fix(event.target)
        todofix = true
      }
    })


    //controller- view- model

    function fix(newvalue) {

      newvalue.innerHTML = `<input id="newvalue">
  <button id="newvaluesubmit" onclick="change(newvalue)">submit</button>`

    }


    function change(newvalue) {
      console.log(todoArea)
      todofix = false
      todoArea.innerHTML = document.getElementById('newvalue').value
    }

    function check() {
      console.log("check")
      undone = row.cells[1].innerHTML

      todoArea.innerHTML = `<strike>${value}</strike>`
      finishedtimeArea.innerHTML = showTime
      return
    }

    function uncheck(todoArea, finishedtimeArea) {
      console.log("uncheck")
      todoArea.innerHTML = undone
      finishedtimeArea.innerHTML = ''
    }

    function toggleChecked(checkbox) {
      let row = checkbox.parentElement.parentElement
      console.log(row)
      let todoArea = row.cells[1]
      let value = row.cells[1].innerHTML
      let finishedtimeArea = row.cells[3]
      let finishedTimebefore = new Date().toLocaleString()
      let showTime = finishedTimebefore.slice(5)

      checkbox.checked ? check(checkbox) : uncheck(todoArea, finishedTimebefore)


      function ischecked() {

        undone = row.cells[1].innerHTML

        todoArea.innerHTML = `<strike>${value}</strike>`
        finishedtimeArea.innerHTML = showTime
        return
      }

      function isunchecked() {

        todoArea.innerHTML = undone
        finishedtimeArea.innerHTML = ''
      }

    }

    function submit() {
      if (todoinput.value) {

        let value = todoinput.value

        let showTimebefore = new Date().toLocaleString()
        let showTime = showTimebefore.slice(5)

        let tablearea = document.getElementById('tablearea')



        if (!firstclick) {
          runfirstclick()
          firstclick = true
        }

        else {
          let table = document.getElementById('ToDoList')
          let newdata = table.insertRow()
          let checkboxArea = newdata.insertCell(0)
          todoArea = newdata.insertCell(1)
          todoArea.name = 'todoArea'
          timeArea = newdata.insertCell(2)
          timeArea.name = 'timeArea'
          finishedtimeArea = newdata.insertCell(3)



          checkboxArea.innerHTML = `<input type="checkbox" name = "done" value = "To_do">`
          todoArea.innerHTML = value
          timeArea.innerHTML = showTime

          todoinput.value = ''
        }
      }

    }


    function runfirstclick() {



      let value = todoinput.value
      let showTimebefore = new Date().toLocaleString()
      let showTime = showTimebefore.slice(5)
      let tablearea = document.getElementById('tablearea')


      tablearea.innerHTML = /*HTML*/`
        <table id="ToDoList" border = 1px style="border-collapse: collapse" >
        <tr>
          <th>check</th>
          <th>To do</th>
          <th>start time</th>
          <th>finished time</th>
        </tr>

        <tr>
          <td><input type="checkbox" name = "done" value = "To_do"></td>
          <td id="todoArea1">${value}</td>
          <td>${showTime}</td>
          <td></td>
        </tr>
      </table>
          `
      todoArea = document.getElementById('todoArea1')
      todoArea.name = 'todoArea'
      todoinput.value = ''
    }

  </script>
</body>

</html>
